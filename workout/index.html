<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>
<meta name="description" content="A dead-simple workout notebook: name on the left, weight and reps on the right, progress tracked per exercise.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --ghost: #b5b3ac;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.12);
  --danger: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --ghost: #5d5c57;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.16);
    --danger: #e66767;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink);
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; background: transparent; border: none; outline: none; width: 100%; padding: 0; border-radius: 0; }
input::placeholder { color: var(--ghost); opacity: 1; }

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: calc(14px + env(safe-area-inset-top)) 20px 12px;
  background: var(--page);
}
.topbar h1 { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn { font-size: 15px; font-weight: 600; color: var(--accent); padding: 6px 8px 6px 0; display: none; }
.unit-btn { font-size: 13px; font-weight: 600; color: var(--muted); padding: 5px 4px; }
.rest-btn { font-size: 13px; font-weight: 700; color: var(--accent); padding: 5px 8px; }

/* ---------- rest timer ---------- */
.rest {
  position: fixed; inset: 0; z-index: 30; background: var(--page);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
.rest h2 { font-size: 18px; margin-bottom: 4px; }
.rest .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; text-align: center; }
.rest-durs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 300px; }
.rest-durs button {
  font-size: 17px; font-weight: 700; color: var(--ink);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 0; width: 86px; background: var(--surface);
}
.rest-durs button:active { border-color: var(--accent); color: var(--accent); }
.rest-cancel { margin-top: 26px; color: var(--muted); font-weight: 650; font-size: 14px; padding: 8px 16px; }
.rest-count {
  font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums;
  margin: 8px 0 2px; letter-spacing: 0.02em;
}
.rest-track { width: 100%; max-width: 320px; height: 4px; background: var(--grid); border-radius: 2px; margin: 10px 0 22px; overflow: hidden; }
.rest-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.25s linear; }
.ad-slot {
  width: 100%; max-width: 336px; min-height: 280px; flex: 0 0 auto;
  border: 1px dashed var(--axis); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ghost); font-size: 13px; font-weight: 600; text-align: center;
  padding: 12px;
}
.rest-skip { margin-top: 18px; color: var(--muted); font-weight: 650; font-size: 14px; padding: 8px 16px; }
.rest-done { font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 8px; }
.unit-confirm { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.unit-confirm button { font-size: 13px; font-weight: 700; padding: 5px 8px; }
#unitYes { color: var(--accent); }
#unitNo { color: var(--muted); }

main { padding: 8px 20px 140px; max-width: 560px; margin: 0 auto; }

.empty-hint { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 24px 0; }

/* ---------- the sheet ---------- */
.day-head {
  font-size: 12px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  margin: 20px 0 2px;
}
.day:first-child .day-head { margin-top: 4px; }
.exrow { display: flex; align-items: stretch; }
.nm-col { width: 44%; padding: 5px 12px 5px 0; }
.nm-col input { font-size: 16px; font-weight: 600; }
.set-col { flex: 1; border-left: 1px solid var(--axis); padding: 5px 0 5px 14px; }
.set-col input { font-size: 16px; color: var(--ink-2); display: block; padding: 1px 0; }
.addset {
  font-size: 13px; font-weight: 600; color: var(--ghost); padding: 2px 0 0;
  display: none;
}
.exrow:focus-within .addset { display: block; }
.addset:active { color: var(--accent); }
.convert-tip {
  display: block; font-size: 12px; font-weight: 650; color: var(--accent);
  padding: 1px 0 3px; text-align: left;
}
.gap { height: 12px; position: relative; cursor: pointer; }
.gap::before {
  content: ''; position: absolute; left: 0; right: 0; top: 5px;
  border-top: 1px dashed var(--grid); opacity: 0; transition: opacity 0.15s;
}
.gap:hover::before, .gap:active::before { opacity: 1; }
.exrow.dragging {
  opacity: 0.92; background: var(--surface); position: relative; z-index: 10;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); border-radius: 10px;
}
.nm-col { touch-action: manipulation; }

/* ---------- basic / advanced ---------- */
.modes { display: flex; justify-content: flex-end; gap: 2px; margin: 2px 0 2px; }
.modes button {
  font-size: 12px; font-weight: 700; color: var(--muted);
  padding: 4px 11px; border-radius: 999px;
}
.modes button.on { color: var(--accent); background: var(--accent-soft); }
.adv { margin: 2px 0 6px; }
.week { display: flex; gap: 4px; }
.wk {
  flex: 1; min-width: 0; text-align: center; padding: 6px 0 5px;
  border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 700;
}
.wk span {
  display: block; font-size: 10px; font-weight: 600; margin-top: 2px;
  color: var(--ink-2); min-height: 13px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; padding: 0 2px;
}
.wk.today { color: var(--accent); }
.wk.sel { background: var(--accent-soft); }
.assign { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.assign .lbl { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
.ach {
  font-size: 13px; font-weight: 650; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
}
.ach.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.wkpreview { font-size: 13px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
.plansline {
  display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center;
  margin-top: 4px; font-size: 13px;
}
.plansline .lbl { color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
.plansline .pl { font-weight: 650; color: var(--ink-2); padding: 3px 0; }
.plansline .newpl { color: var(--accent); font-weight: 700; padding: 3px 0; }

/* ---------- plan editor ---------- */
.plan-name { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
.pex-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--grid); }
.pex-row input { font-size: 16px; }
.pex-row .rm { color: var(--muted); font-size: 15px; padding: 2px 8px; }
.addex { display: block; color: var(--accent); font-weight: 650; padding: 10px 0; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips button {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px;
}
.del-plan { display: block; margin: 30px auto 0; color: var(--danger); font-weight: 650; font-size: 14px; padding: 8px 16px; }

/* ---------- progress list ---------- */
.p-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 0; border-bottom: 1px solid var(--grid);
}
.p-row .grow { flex: 1; min-width: 0; }
.p-row .name { font-size: 16px; font-weight: 650; }
.p-row .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.p-row .big { font-size: 17px; font-weight: 700; white-space: nowrap; }
.p-row .big small { font-size: 12px; font-weight: 600; color: var(--muted); }
.chev { color: var(--muted); font-size: 18px; }

/* ---------- detail ---------- */
.statline { font-size: 14px; color: var(--ink-2); margin: 4px 0 20px; }
.statline b { font-size: 16px; color: var(--ink); }
.statline span { margin-right: 14px; }
.chart-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.chart-wrap { position: relative; touch-action: pan-y; margin-bottom: 8px; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip {
  position: absolute; pointer-events: none; display: none;
  background: var(--ink); color: var(--page);
  font-size: 12px; font-weight: 600; line-height: 1.4;
  padding: 6px 9px; border-radius: 8px; white-space: nowrap;
  transform: translate(-50%, -100%); z-index: 3;
}
.tip .d { font-weight: 500; opacity: 0.75; }
.section-head { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 24px 0 4px; }
.h-row {
  display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
  padding: 12px 0; border-bottom: 1px solid var(--grid);
}
.h-row .grow { flex: 1; min-width: 0; font-size: 15px; color: var(--ink-2); }
.h-row .meta { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* ---------- progress pics ---------- */
.addphoto {
  display: block; width: 100%; text-align: center; color: var(--accent);
  font-weight: 700; font-size: 15px; padding: 13px 0;
  border: 1px dashed var(--axis); border-radius: 12px; margin-bottom: 14px;
}
.picbar { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.picbar button { font-weight: 700; color: var(--accent); }
.picbar .del { color: var(--danger); }
.picbar .dim { color: var(--muted); font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pcell { position: relative; }
.pcell img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; display: block; }
.pcell.sel img { outline: 3px solid var(--accent); outline-offset: -3px; }
.pcell .pd { font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
.pcell .badge {
  position: absolute; top: 6px; left: 6px; width: 18px; height: 18px;
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.cmp {
  position: fixed; inset: 0; background: var(--page); z-index: 20;
  padding: calc(16px + env(safe-area-inset-top)) 16px 24px; overflow-y: auto;
}
.cmp-head { display: flex; align-items: baseline; margin-bottom: 4px; }
.cmp-days { flex: 1; font-size: 22px; font-weight: 800; }
.cmp-close { color: var(--accent); font-weight: 700; font-size: 15px; padding: 4px 0 4px 12px; }
.cmp-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.cmp-imgs { display: flex; gap: 8px; }
.cmp-imgs figure { flex: 1; min-width: 0; margin: 0; }
.cmp-imgs img { width: 100%; border-radius: 10px; display: block; }
.cmp-imgs figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; }

/* ---------- tabbar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex;
  background: var(--page);
  border-top: 1px solid var(--grid);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabbar button.active { color: var(--accent); }
.tabbar svg { width: 24px; height: 24px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" id="backBtn">&#8249; Back</button>
  <h1 id="title">Lift Log</h1>
  <button class="rest-btn" id="restBtn">&#9201; Rest</button>
  <div class="unit-confirm hidden" id="unitConfirm">
    <span id="unitConfirmMsg">Convert to kg?</span>
    <button id="unitYes">Yes</button>
    <button id="unitNo">No</button>
  </div>
  <button class="unit-btn" id="unitBtn">lb</button>
</header>

<main id="main"></main>

<nav class="tabbar">
  <button id="tabLog" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5z M9 8h6 M9 12h6 M9 16h4"/></svg>
    Log
  </button>
  <button id="tabProgress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 10 12l4 3 6-8"/><path d="M4 21h16" opacity="0.4"/></svg>
    Progress
  </button>
  <button id="tabPics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3.5L9 6h6l1.5 2H20v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
    Pics
  </button>
</nav>
<input type="file" accept="image/*" capture="environment" id="picFile" class="hidden">

<script>
'use strict';

/* ================= storage ================= */
const KEY = 'liftlog.sessions.v3';
const UNIT_KEY = 'liftlog.unit';

/* one-time migration from the v2 free-text notes */
function migrate() {
  if (localStorage.getItem(KEY)) return;
  let old;
  try { old = JSON.parse(localStorage.getItem('liftlog.notes.v2')); } catch { old = null; }
  if (!old || !old.length) return;
  const sessions = old.map((n, i) => {
    const rows = [];
    n.text.split('\n').forEach((line) => {
      const raw = line.trim();
      if (!raw) return;
      const norm = raw.replace(/×/g, 'x');
      const head = norm.match(/^([^\d@]*)/)[1];
      const name = head.replace(/[\s:,\-–—]+$/, '').trim();
      const rest = norm.slice(head.length).trim();
      if (!name && !rest) return;
      const sets = [];
      const re = /(\d+(?:\.\d+)?)\s*(?:kg|lbs?|#)?\s*x\s*(\d+(?:\.\d+)?)|@?\s*(\d+(?:\.\d+)?)/g;
      let m;
      while ((m = re.exec(rest)) !== null) {
        if (m[1] !== undefined) sets.push(`${m[1]} for ${m[2]}`);
        else sets.push(`${m[3]}`);
      }
      rows.push({ name: name || raw, sets });
    });
    return { id: 'm' + i, date: n.date, rows, ts: n.ts || Date.now() };
  }).filter((s) => s.rows.length);
  if (sessions.length) localStorage.setItem(KEY, JSON.stringify(sessions));
}
migrate();

const loadSessions = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };

const PLANS_KEY = 'liftlog.plans.v1';
const WEEK_KEY = 'liftlog.week.v1';
const MODE_KEY = 'liftlog.mode';
const loadJSON = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch { return fb; } };

let sessions = loadSessions();     // [{id, date:'YYYY-MM-DD', rows:[{name, sets:['135 for 8',...]}], ts}]
let unit = localStorage.getItem(UNIT_KEY) || 'lb';
let plans = loadJSON(PLANS_KEY, []);      // [{id, name, exercises:[names]}]
let weekMap = loadJSON(WEEK_KEY, {});     // {dow(0-6): planId}
let mode = localStorage.getItem(MODE_KEY) || 'basic';
let view = { screen: 'log', exercise: null, planId: null };
let saveTimer = null;

function persistPlans() {
  localStorage.setItem(PLANS_KEY, JSON.stringify(plans));
  localStorage.setItem(WEEK_KEY, JSON.stringify(weekMap));
}

function persist() {
  const clean = sessions
    .map((s) => ({ ...s, rows: s.rows
      .map((r) => ({ name: r.name.trim(), sets: r.sets.map((x) => x.trim()).filter(Boolean) }))
      .filter((r) => r.name || r.sets.length) }))
    .filter((s) => s.rows.length);
  localStorage.setItem(KEY, JSON.stringify(clean));
}
const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 300); };

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmtDay = (iso) => {
  const t = todayStr();
  if (iso === t) return 'Today';
  const y = new Date(Date.now() - 864e5);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  if (iso === yStr) return 'Yesterday';
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
};
const fmtShort = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

/* ================= set-line parser =================
   One set line is what you'd scribble next to an exercise:
   "135 for 13" · "200lb for 8" · "135x8" · "30 for 6f" · "10, 8, 6" · "12"  */
function parseSetLine(str) {
  let t = String(str).toLowerCase().replace(/×/g, 'x')
    .replace(/\b(for|fir|fur|fro|fot)\b/g, 'x')   // tolerate 'for' typos
    .replace(/(kg|lbs?|#)/g, '');
  const out = [];
  const re = /(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?(?:\s*[,\s]\s*\d+(?:\.\d+)?)*)|(\d+(?:\.\d+)?)/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    if (m[1] !== undefined) {
      const w = parseFloat(m[1]);
      m[2].split(/[\s,]+/).filter(Boolean).forEach((r) => out.push({ w, r: parseFloat(r) }));
    } else {
      out.push({ w: 0, r: parseFloat(m[3]) });   // bare number = reps (bodyweight)
    }
  }
  return out;
}

/* ================= derived data ================= */
function allEntries() {
  const out = [];   // {date, name, sets:[{w,r}], lines:[str]}
  sessions.forEach((s) => s.rows.forEach((r) => {
    const name = r.name.trim().replace(/[:\-–—\s]+$/, '');
    if (!name) return;
    const lines = r.sets.map((x) => x.trim()).filter(Boolean);
    const sets = lines.flatMap(parseSetLine);
    if (sets.length) out.push({ date: s.date, name, sets, lines });
  }));
  return out;
}
const topWeight = (e) => Math.max(0, ...e.sets.map((s) => s.w));
const topReps = (e) => Math.max(0, ...e.sets.map((s) => s.r));

const normName = (n) => n.trim().replace(/[:\-–—\s]+$/, '').toLowerCase();

/* last time you did this exercise before `date`: its set lines (the ghosts) */
function prevSetsFor(name, date) {
  const key = normName(name);
  if (!key) return [];
  let best = null;
  sessions.forEach((s) => {
    if (s.date >= date) return;
    s.rows.forEach((r) => {
      if (normName(r.name) !== key) return;
      const lines = r.sets.map((x) => x.trim()).filter(Boolean);
      if (!lines.length) return;
      if (!best || s.date > best.date) best = { date: s.date, lines };
    });
  });
  return best ? best.lines : [];
}

/* ================= rendering ================= */
const main = $('main');

function render() {
  $('backBtn').style.display = (view.screen === 'detail' || view.screen === 'plan') ? 'block' : 'none';
  $('tabLog').classList.toggle('active', view.screen === 'log' || view.screen === 'plan');
  $('tabProgress').classList.toggle('active', view.screen === 'progress' || view.screen === 'detail');
  $('tabPics').classList.toggle('active', view.screen === 'pics');
  $('unitBtn').textContent = unit;
  if (view.screen === 'log') { $('title').textContent = 'Lift Log'; renderLog(); }
  else if (view.screen === 'plan') { renderPlan(); }
  else if (view.screen === 'progress') { $('title').textContent = 'Progress'; renderProgress(); }
  else if (view.screen === 'pics') { renderPics(); }
  else { $('title').textContent = view.exercise; renderDetail(view.exercise); }
}

/* ---------- the open sheet ---------- */
/* date (YYYY-MM-DD) of a given weekday within the current Mon-Sun week */
function dateForDow(dow) {
  const now = new Date();
  const sinceMon = (now.getDay() + 6) % 7;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - sinceMon);
  const dte = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + ((dow + 6) % 7));
  return `${dte.getFullYear()}-${String(dte.getMonth() + 1).padStart(2, '0')}-${String(dte.getDate()).padStart(2, '0')}`;
}

/* put a plan's exercises onto a date's sheet (never touches logged sets) */
function applyPlanToDate(date, pid) {
  let s = sessions.find((x) => x.date === date);
  const plan = plans.find((p) => p.id === pid);
  const hasData = s && s.rows.some((r) => r.sets.some((x) => x && x.trim()));
  if (hasData) return;
  if (!plan) {
    if (s && s.planApplied) { s.rows = []; delete s.planApplied; persist(); }
    return;
  }
  if (!s) {
    s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), date, rows: [], ts: Date.now() };
    sessions.push(s);
  }
  if (s.rows.some((r) => r.name.trim()) && !s.planApplied) return;  // hand-written rows win
  s.rows = plan.exercises.filter((n) => n.trim()).map((n) => ({ name: n, sets: [] }));
  s.planApplied = pid;
  persist();
}

function applyTodaysPlan() {
  if (mode !== 'advanced') return;
  applyPlanToDate(todayStr(), weekMap[new Date().getDay()]);
}

/* keep plan-prefilled days in step with their plan until sets get logged,
   so an exercise added to a split shows up on the sheet too */
function syncPlannedSessions() {
  sessions.forEach((s) => {
    if (!s.planApplied) return;
    const plan = plans.find((p) => p.id === s.planApplied);
    if (!plan) return;
    if (s.rows.some((r) => r.sets.some((x) => x && x.trim()))) return;
    const names = plan.exercises.filter((n) => n.trim());
    const lower = names.map((n) => n.toLowerCase());
    const extras = s.rows.filter((r) => r.name.trim() && !lower.includes(r.name.trim().toLowerCase()));
    s.rows = [...names.map((n) => ({ name: n, sets: [] })), ...extras];
  });
}

function renderLog() {
  clearTimeout(saveTimer);
  // make sure today exists
  if (!sessions.some((s) => s.date === todayStr())) {
    sessions.push({ id: Date.now().toString(36), date: todayStr(), rows: [], ts: Date.now() });
  }
  applyTodaysPlan();
  syncPlannedSessions();
  // future days never live in the notes: drop leftover plan previews, and
  // keep any future day with real logged sets hidden until its date arrives
  const before = sessions.length;
  sessions = sessions.filter((s) => s.date <= todayStr() || s.rows.some((r) => r.sets.some((x) => x && x.trim())));
  if (sessions.length !== before) persist();
  const sorted = sessions.filter((s) => s.date <= todayStr()).sort((a, b) => b.date < a.date ? -1 : 1);
  main.innerHTML = '';

  // basic / advanced switch
  const modes = document.createElement('div');
  modes.className = 'modes';
  modes.innerHTML = `
    <button data-mode="basic" class="${mode === 'basic' ? 'on' : ''}">Basic</button>
    <button data-mode="advanced" class="${mode === 'advanced' ? 'on' : ''}">Advanced</button>`;
  main.appendChild(modes);

  if (mode === 'advanced') main.appendChild(buildAdvStrip());

  const hasAny = sessions.some((s) => s.rows.some((r) => r.name.trim() || r.sets.some((x) => x.trim())));
  sorted.forEach((s) => {
    const day = document.createElement('div');
    day.className = 'day';
    day.id = 'day-' + s.date;
    day.innerHTML = `<div class="day-head">${fmtDay(s.date)}</div>`;
    const cont = document.createElement('div');
    cont.className = 'rows';
    day.appendChild(cont);
    renderDayRows(s, cont);
    main.appendChild(day);
  });

  if (!hasAny) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = `Type an exercise on the left, hit return, and write the weight on the right &mdash; like <b>135 for 13</b>. Return again for another set. Next workout, last time&rsquo;s numbers show up grayed out so you know what to beat.`;
    main.querySelector('.day').appendChild(hint);
  }
}

/* ---------- advanced: week calendar + plans ---------- */
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];
const DOW_L = { 1: 'M', 2: 'T', 3: 'W', 4: 'T', 5: 'F', 6: 'S', 0: 'S' };
const DOW_FULL = { 1: 'Monday', 2: 'Tuesday', 3: 'Wednesday', 4: 'Thursday', 5: 'Friday', 6: 'Saturday', 0: 'Sunday' };
let selDow = new Date().getDay();

function buildAdvStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'adv';
  const todayDow = new Date().getDay();
  const cur = weekMap[selDow];
  const curPlan = plans.find((p) => p.id === cur);
  const selIsToday = dateForDow(selDow) === todayStr();
  wrap.innerHTML = `
    <div class="week">${DOW_ORDER.map((d) => {
      const p = plans.find((x) => x.id === weekMap[d]);
      return `<button class="wk ${d === todayDow ? 'today' : ''} ${d === selDow ? 'sel' : ''}" data-dow="${d}">${DOW_L[d]}<span>${p ? esc(p.name || 'Plan') : '–'}</span></button>`;
    }).join('')}</div>
    <div class="assign">
      <span class="lbl">${DOW_FULL[selDow]}</span>
      <button class="ach ${!cur ? 'on' : ''}" data-assign="">Rest</button>
      ${plans.map((p) => `<button class="ach ${cur === p.id ? 'on' : ''}" data-assign="${p.id}">${esc(p.name || 'Plan')}</button>`).join('')}
    </div>
    ${!selIsToday && curPlan ? `<div class="wkpreview">${esc(curPlan.exercises.filter((n) => n.trim()).join(' · ') || 'No exercises yet')}</div>` : ''}
    <div class="plansline">
      <span class="lbl">Plans</span>
      ${plans.map((p) => `<button class="pl" data-plan="${p.id}">${esc(p.name || 'Plan')}</button>`).join('')}
      <button class="newpl" data-newplan>+ New plan</button>
    </div>`;
  return wrap;
}

function newPlan() {
  const p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: '', exercises: [] };
  plans.push(p);
  persistPlans();
  view = { screen: 'plan', planId: p.id };
  render();
}

function removePlan(id) {
  plans = plans.filter((p) => p.id !== id);
  Object.keys(weekMap).forEach((d) => { if (weekMap[d] === id) delete weekMap[d]; });
  persistPlans();
}

function leavePlanEditor() {
  const plan = plans.find((p) => p.id === view.planId);
  if (plan) {
    plan.exercises = plan.exercises.filter((n) => n.trim());
    if (!plan.name.trim() && !plan.exercises.length) removePlan(plan.id);
    else persistPlans();
  }
}

function knownExercises() {
  const seen = new Map();
  allEntries().forEach((e) => seen.set(e.name.toLowerCase(), e.name));
  plans.forEach((p) => p.exercises.forEach((n) => { if (n.trim()) seen.set(n.toLowerCase(), n); }));
  return [...seen.values()];
}

function renderPlan() {
  const plan = plans.find((p) => p.id === view.planId);
  if (!plan) { view = { screen: 'log' }; render(); return; }
  $('title').textContent = plan.name || 'New plan';
  main.innerHTML = '';

  const nameInp = document.createElement('input');
  nameInp.className = 'plan-name';
  nameInp.placeholder = 'Plan name (e.g. Legs)';
  nameInp.autocapitalize = 'words';
  nameInp.value = plan.name;
  nameInp.addEventListener('input', () => {
    plan.name = nameInp.value;
    persistPlans();
    $('title').textContent = plan.name || 'New plan';
  });
  main.appendChild(nameInp);

  const head = document.createElement('div');
  head.className = 'section-head';
  head.textContent = 'Exercises';
  main.appendChild(head);
  const list = document.createElement('div');
  main.appendChild(list);

  const addBtn = document.createElement('button');
  addBtn.className = 'addex';
  addBtn.textContent = '+ Add exercise';
  addBtn.addEventListener('click', () => {
    plan.exercises.push('');
    renderList();
    const inputs = list.querySelectorAll('input');
    inputs[inputs.length - 1].focus();
  });
  main.appendChild(addBtn);

  const chipHead = document.createElement('div');
  chipHead.className = 'section-head';
  chipHead.textContent = 'From your notes';
  const chips = document.createElement('div');
  chips.className = 'chips';
  main.appendChild(chipHead);
  main.appendChild(chips);

  const del = document.createElement('button');
  del.className = 'del-plan';
  del.textContent = 'Delete plan';
  del.addEventListener('click', () => {
    removePlan(plan.id);
    view = { screen: 'log' };
    render();
  });
  main.appendChild(del);

  function renderList() {
    list.innerHTML = '';
    plan.exercises.forEach((n, i) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'pex-row';
      const inp = document.createElement('input');
      inp.value = n;
      inp.placeholder = 'Exercise';
      inp.autocapitalize = 'words';
      inp.enterKeyHint = 'next';
      inp.addEventListener('input', () => { plan.exercises[i] = inp.value; persistPlans(); renderChips(); });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });
      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.textContent = '✕';
      rm.addEventListener('click', () => { plan.exercises.splice(i, 1); persistPlans(); renderList(); renderChips(); });
      rowEl.appendChild(inp);
      rowEl.appendChild(rm);
      list.appendChild(rowEl);
    });
  }
  function renderChips() {
    const inPlan = new Set(plan.exercises.map((n) => n.trim().toLowerCase()));
    const avail = knownExercises().filter((n) => !inPlan.has(n.toLowerCase()));
    chipHead.style.display = avail.length ? '' : 'none';
    chips.innerHTML = '';
    avail.forEach((n) => {
      const b = document.createElement('button');
      b.textContent = n;
      b.addEventListener('click', () => { plan.exercises.push(n); persistPlans(); renderList(); renderChips(); });
      chips.appendChild(b);
    });
  }
  renderList();
  renderChips();
  if (!plan.name) setTimeout(() => nameInp.focus(), 100);
}

function renderDayRows(session, cont, focusIdx, keepRow) {
  cont.innerHTML = '';
  // drop rows that never got anything written in them
  session.rows = session.rows.filter((r) => r === keepRow || r.name.trim() || r.sets.some((x) => x && x.trim()));
  if (session.date >= todayStr()) {
    // today and upcoming days always end with a blank row to type into
    const last = session.rows[session.rows.length - 1];
    if (!last || last.name.trim() || last.sets.some((x) => x.trim())) {
      session.rows.push({ name: '', sets: [] });
    }
  }
  session.rows.forEach((r, i) => {
    if (i > 0) cont.appendChild(buildGap(session, cont));
    cont.appendChild(buildRow(session, r, cont));
  });
  // past days: a tap zone after the last row to append an exercise
  if (session.rows.length && session.date < todayStr()) cont.appendChild(buildGap(session, cont));
  if (focusIdx !== undefined) {
    const rowEl = cont.querySelectorAll('.exrow')[focusIdx];
    if (rowEl) rowEl.querySelector('.nm-col input').focus();
  }
}

/* the thin space between rows — tap it to slot an exercise in there */
function buildGap(session, cont) {
  const g = document.createElement('div');
  g.className = 'gap';
  g.addEventListener('click', () => {
    let idx = 0, el = g.previousElementSibling;
    while (el) { if (el.classList.contains('exrow')) idx++; el = el.previousElementSibling; }
    const fresh = { name: '', sets: [] };
    session.rows.splice(idx, 0, fresh);
    session.ts = Date.now();
    renderDayRows(session, cont, idx, fresh);
  });
  return g;
}

function buildRow(session, row, cont) {
  const el = document.createElement('div');
  el.className = 'exrow';

  const nmCol = document.createElement('div');
  nmCol.className = 'nm-col';
  const nm = document.createElement('input');
  nm.type = 'text';
  nm.value = row.name;
  nm.placeholder = 'Exercise';
  nm.autocapitalize = 'words';
  nm.enterKeyHint = 'next';
  nmCol.appendChild(nm);

  const setCol = document.createElement('div');
  setCol.className = 'set-col';

  const ghosts = () => prevSetsFor(row.name, session.date);

  function setInput(i) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'text';
    inp.enterKeyHint = 'next';
    inp.value = row.sets[i] || '';
    inp.dataset.i = i;

    // when they write the *other* unit ("60kg" while set to lb), offer the conversion
    let tip = null;
    const applyConvert = () => {
      inp.value = inp.value.replace(/(\d+(?:\.\d+)?)\s*(kg|lbs?)\b/gi, (m, num, u) => {
        const uu = u.toLowerCase().startsWith('k') ? 'kg' : 'lb';
        if (uu === unit) return num;
        const v = parseFloat(num);
        return String(Math.round((uu === 'kg' ? v * 2.20462 : v / 2.20462) * 10) / 10);
      });
      row.sets[i] = inp.value;
      queueSave();
      updateTip();
    };
    function updateTip() {
      const m = inp.value.match(/(\d+(?:\.\d+)?)\s*(kg|lbs?)\b/i);
      const typed = m ? (m[2].toLowerCase().startsWith('k') ? 'kg' : 'lb') : null;
      if (!typed || typed === unit) { if (tip) { tip.remove(); tip = null; } return; }
      const v = parseFloat(m[1]);
      const conv = Math.round((typed === 'kg' ? v * 2.20462 : v / 2.20462) * 10) / 10;
      if (!tip) {
        tip = document.createElement('button');
        tip.className = 'convert-tip';
        tip.addEventListener('pointerdown', (e) => { e.preventDefault(); applyConvert(); });
        inp.after(tip);
      }
      tip.textContent = `= ${conv} ${unit} · tap to convert`;
    }
    inp._updateTip = updateTip;

    inp.addEventListener('input', () => {
      // autocorrect 'for' typos once the next character lands: "135 fur 8" -> "135 for 8"
      const fixed = inp.value.replace(/\b(fir|fur|fro|fot)(?=[\s\d.,])/gi, 'for');
      if (fixed !== inp.value) {
        const pos = inp.selectionStart;
        inp.value = fixed;
        inp.setSelectionRange(pos, pos);
      }
      row.sets[i] = inp.value;
      session.ts = Date.now();
      queueSave();
      updateTip();
      ensureTrailingRow();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (inp.value.trim()) addLine(i + 1);
      else focusNextRow();
    });
    return inp;
  }

  function renderSets() {
    setCol.innerHTML = '';
    const g = ghosts();
    const count = Math.max(1, row.sets.length, g.length);
    for (let i = 0; i < count; i++) {
      const inp = setInput(i);
      inp.placeholder = g[i] || (i === 0 ? (g.length ? '' : 'weight for reps') : '');
      setCol.appendChild(inp);
      inp._updateTip();
    }
    const add = document.createElement('button');
    add.className = 'addset';
    add.textContent = '+ set';
    // pointerdown so the tap lands before focus leaves the row (which hides this button)
    add.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      addLine(setCol.querySelectorAll('input').length);
    });
    setCol.appendChild(add);
  }

  function addLine(at) {
    const inputs = [...setCol.querySelectorAll('input')];
    if (at < inputs.length) { inputs[at].focus(); return; }
    while (row.sets.length < at) row.sets.push(row.sets.length < inputs.length ? inputs[row.sets.length].value : '');
    row.sets.push('');
    renderSets();
    const all = setCol.querySelectorAll('input');
    all[all.length - 1].focus();
  }

  function ensureTrailingRow() {
    if (session.date < todayStr()) return;
    const rows = session.rows;
    const last = rows[rows.length - 1];
    if (last && (last.name.trim() || last.sets.some((x) => x && x.trim()))) {
      const r = { name: '', sets: [] };
      rows.push(r);
      cont.appendChild(buildGap(session, cont));
      cont.appendChild(buildRow(session, r, cont));
    }
  }

  function refreshGhosts() {
    const g = ghosts();
    const inputs = [...setCol.querySelectorAll('input')];
    const count = Math.max(1, row.sets.length, g.length);
    if (count !== inputs.length) { renderSets(); return; }
    inputs.forEach((inp, i) => {
      inp.placeholder = g[i] || (i === 0 && !g.length ? 'weight for reps' : '');
    });
  }

  // long names shrink until they fit instead of getting cut off
  function fitName() {
    nm.style.fontSize = '';
    let size = 16;
    while (nm.scrollWidth > nm.clientWidth && size > 11) {
      size--;
      nm.style.fontSize = size + 'px';
    }
  }

  nm.addEventListener('input', () => {
    row.name = nm.value;
    session.ts = Date.now();
    queueSave();
    fitName();
    refreshGhosts();
    ensureTrailingRow();
  });
  nm.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (nm.value.trim()) setCol.querySelector('input').focus();
  });

  function focusNextRow() {
    let next = el.nextElementSibling;
    while (next && !next.classList.contains('exrow')) next = next.nextElementSibling;
    if (next) next.querySelector('.nm-col input').focus();
  }

  // hold the name for half a second, then drag the exercise up or down
  el._row = row;
  nmCol.addEventListener('pointerdown', (e) => {
    const startY = e.clientY;
    let holdTimer = setTimeout(() => startDrag(), 450);
    const cancel = () => { clearTimeout(holdTimer); nmCol.removeEventListener('pointermove', moveCheck); };
    const moveCheck = (ev) => { if (Math.abs(ev.clientY - startY) > 8) cancel(); };
    nmCol.addEventListener('pointermove', moveCheck);
    nmCol.addEventListener('pointerup', cancel, { once: true });
    nmCol.addEventListener('pointercancel', cancel, { once: true });

    function startDrag() {
      nmCol.removeEventListener('pointermove', moveCheck);
      if (document.activeElement) document.activeElement.blur();
      el.classList.add('dragging');
      cont.querySelectorAll('.gap').forEach((g) => g.remove());
      const stopScroll = (ev) => ev.preventDefault();
      window.addEventListener('touchmove', stopScroll, { passive: false });
      const onMove = (ev) => {
        const y = ev.clientY;
        const others = [...cont.querySelectorAll('.exrow')].filter((r) => r !== el);
        const all = [...cont.children];
        for (const r of others) {
          const b = r.getBoundingClientRect();
          const mid = b.top + b.height / 2;
          if (all.indexOf(r) < all.indexOf(el) && y < mid) { cont.insertBefore(el, r); break; }
          if (all.indexOf(r) > all.indexOf(el) && y > mid) { cont.insertBefore(el, r.nextSibling); break; }
        }
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', stopScroll);
        el.classList.remove('dragging');
        session.rows = [...cont.querySelectorAll('.exrow')].map((r) => r._row);
        session.ts = Date.now();
        persist();
        renderDayRows(session, cont);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
  });
  nmCol.addEventListener('contextmenu', (e) => e.preventDefault());

  // when focus leaves the row: drop blank set lines, and if nothing was
  // ever written, remove the whole row (accidental inserts vanish)
  el.addEventListener('focusout', () => {
    setTimeout(() => {
      if (el.contains(document.activeElement)) return;
      const kept = row.sets.filter((x) => x && x.trim());
      if (kept.length !== row.sets.length) {
        row.sets = kept;
        renderSets();
      }
      const isTodayTrailing = session.date >= todayStr() && session.rows[session.rows.length - 1] === row;
      if (!isTodayTrailing && !row.name.trim() && !row.sets.length) {
        const idx = session.rows.indexOf(row);
        if (idx > -1) session.rows.splice(idx, 1);
        const prev = el.previousElementSibling;
        if (prev && prev.classList.contains('gap')) prev.remove();
        else {
          const nx = el.nextElementSibling;
          if (nx && nx.classList.contains('gap')) nx.remove();
        }
        el.remove();
      }
      queueSave();
    }, 80);
  });

  el.appendChild(nmCol);
  el.appendChild(setCol);
  renderSets();
  requestAnimationFrame(fitName);
  return el;
}

/* ---------- progress ---------- */
function renderProgress() {
  const entries = allEntries();
  const seen = new Map();
  entries.forEach((e) => seen.set(e.name.toLowerCase(), e.name));
  const names = [...seen.values()];
  if (!names.length) {
    main.innerHTML = `<div class="empty-hint">Write down a workout first &mdash; every exercise you log shows up here with its own progress chart.</div>`;
    return;
  }
  main.innerHTML = names.map((n) => {
    const list = entries.filter((e) => e.name.toLowerCase() === n.toLowerCase());
    const days = [...new Set(list.map((e) => e.date))].sort();
    const bw = list.every((e) => topWeight(e) === 0);
    const best = Math.max(...list.map((e) => bw ? topReps(e) : topWeight(e)));
    return `
      <button class="p-row" data-detail="${esc(n)}">
        <div class="grow">
          <div class="name">${esc(n)}</div>
          <div class="meta">${days.length} session${days.length === 1 ? '' : 's'} &middot; last ${fmtShort(days[days.length - 1])}</div>
        </div>
        <div class="big">${best}<small> ${bw ? 'reps' : unit}</small></div>
        <div class="chev">&#8250;</div>
      </button>`;
  }).join('');
}

function renderDetail(name) {
  const entries = allEntries().filter((e) => e.name.toLowerCase() === name.toLowerCase());
  if (!entries.length) { view = { screen: 'progress' }; render(); return; }
  entries.sort((a, b) => a.date < b.date ? -1 : 1);
  const bw = entries.every((e) => topWeight(e) === 0);
  const metric = (e) => bw ? topReps(e) : topWeight(e);
  const mUnit = bw ? 'reps' : unit;

  const byDay = {};
  entries.forEach((e) => { byDay[e.date] = Math.max(byDay[e.date] || 0, metric(e)); });
  const points = Object.keys(byDay).sort().map((d) => ({ date: d, v: byDay[d] }));

  const best = Math.max(...points.map((p) => p.v));
  const last = points[points.length - 1].v;
  const delta = last - points[0].v;

  main.innerHTML = `
    <div class="statline">
      <span>Last <b>${last}</b> ${mUnit}</span>
      <span>Best <b>${best}</b> ${mUnit}</span>
      <span>Since start <b>${delta >= 0 ? '+' : ''}${Math.round(delta * 10) / 10}</b> ${mUnit}</span>
    </div>
    <div class="chart-title">Top ${bw ? 'reps' : 'set weight'} over time</div>
    <div class="chart-wrap" id="chartWrap"></div>
    <div class="section-head">History</div>
    ${entries.slice().reverse().map((e) => `
      <button class="h-row" data-day="${e.date}">
        <div class="grow">${esc(e.lines.join(' · '))}</div>
        <div class="meta">${fmtShort(e.date)}</div>
      </button>`).join('')}`;

  drawChart($('chartWrap'), points, mUnit);
}

/* ================= progress pics (IndexedDB) ================= */
let dbPromise = null;
function getDB() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('liftlog-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function photosAll() {
  const db = await getDB();
  return new Promise((res, rej) => {
    const rq = db.transaction('photos').objectStore('photos').getAll();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => rej(rq.error);
  });
}
async function photoPut(rec) {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').put(rec);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function photoDel(id) {
  const db = await getDB();
  return new Promise((res, rej) => {
    const tx = db.transaction('photos', 'readwrite');
    tx.objectStore('photos').delete(id);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
/* shrink camera shots so the gallery stays lean */
async function shrinkImage(file) {
  try {
    const img = await createImageBitmap(file);
    const max = 1280;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', 0.85));
  } catch { return file; }
}

let picSel = [];          // up to 2 selected photo ids
let compareOpen = false;
let picUrls = [];

async function renderPics() {
  $('title').textContent = 'Progress pics';
  let photos;
  try { photos = await photosAll(); }
  catch {
    main.innerHTML = `<div class="empty-hint">Photos aren&rsquo;t available in this browser.</div>`;
    return;
  }
  if (view.screen !== 'pics') return;
  photos.sort((a, b) => b.ts - a.ts);
  picSel = picSel.filter((id) => photos.some((p) => p.id === id));
  picUrls.forEach((u) => URL.revokeObjectURL(u));
  picUrls = [];

  main.innerHTML = '';
  const add = document.createElement('button');
  add.className = 'addphoto';
  add.textContent = '+ Take a progress pic';
  add.addEventListener('click', () => $('picFile').click());
  main.appendChild(add);

  if (picSel.length) {
    const bar = document.createElement('div');
    bar.className = 'picbar';
    bar.innerHTML = `
      ${picSel.length === 2 ? `<button data-cmp>Compare</button>` : `<span class="dim">Pick ${2 - picSel.length} more to compare</span>`}
      <button class="del" data-pdel>Delete</button>
      <button class="dim" data-pclear>Clear</button>`;
    bar.querySelector('[data-cmp]')?.addEventListener('click', () => { compareOpen = true; renderPics(); });
    bar.querySelector('[data-pdel]').addEventListener('click', async () => {
      for (const id of picSel) await photoDel(id);
      picSel = []; compareOpen = false;
      renderPics();
    });
    bar.querySelector('[data-pclear]').addEventListener('click', () => { picSel = []; renderPics(); });
    main.appendChild(bar);
  }

  if (!photos.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Snap a pic each week or so — then tap any two to see how far you’ve come.';
    main.appendChild(hint);
  } else {
    const grid = document.createElement('div');
    grid.className = 'pgrid';
    photos.forEach((p) => {
      const url = URL.createObjectURL(p.blob);
      picUrls.push(url);
      const cell = document.createElement('div');
      cell.className = 'pcell' + (picSel.includes(p.id) ? ' sel' : '');
      const n = picSel.indexOf(p.id);
      cell.innerHTML = `<img src="${url}" alt="Progress photo">${n > -1 ? `<span class="badge">${n + 1}</span>` : ''}<div class="pd">${fmtShort(p.date)}</div>`;
      cell.addEventListener('click', () => {
        const i = picSel.indexOf(p.id);
        if (i > -1) picSel.splice(i, 1);
        else { picSel.push(p.id); if (picSel.length > 2) picSel.shift(); }
        renderPics();
      });
      grid.appendChild(cell);
    });
    main.appendChild(grid);
  }

  if (compareOpen && picSel.length === 2) {
    const pair = picSel.map((id) => photos.find((p) => p.id === id)).sort((a, b) => a.ts - b.ts);
    const days = Math.round((new Date(pair[1].date + 'T12:00:00') - new Date(pair[0].date + 'T12:00:00')) / 864e5);
    const u1 = URL.createObjectURL(pair[0].blob), u2 = URL.createObjectURL(pair[1].blob);
    picUrls.push(u1, u2);
    const cmp = document.createElement('div');
    cmp.className = 'cmp';
    cmp.innerHTML = `
      <div class="cmp-head">
        <div class="cmp-days">${days === 0 ? 'Same day' : days + ' day progress'}</div>
        <button class="cmp-close">Close</button>
      </div>
      <div class="cmp-sub">${fmtShort(pair[0].date)} &rarr; ${fmtShort(pair[1].date)}</div>
      <div class="cmp-imgs">
        <figure><img src="${u1}" alt="Before"><figcaption>${fmtShort(pair[0].date)}</figcaption></figure>
        <figure><img src="${u2}" alt="After"><figcaption>${fmtShort(pair[1].date)}</figcaption></figure>
      </div>`;
    cmp.querySelector('.cmp-close').addEventListener('click', () => { compareOpen = false; renderPics(); });
    main.appendChild(cmp);
  } else {
    compareOpen = false;
  }
}

$('picFile').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const blob = await shrinkImage(file);
  await photoPut({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    ts: Date.now(),
    date: todayStr(),
    blob
  });
  if (view.screen === 'pics') renderPics();
});

/* ================= rest timer =================
   Full-screen rest between sets: pick a duration, the countdown takes
   over the screen so there's nothing else to scroll. The .ad-slot box
   is reserved for a real ad unit — once you have an ad network account
   (e.g. Google AdSense), paste its snippet into #adSlot below and the
   ad will fill the slot for the duration of every rest. */
let restTimer = null;
let wakeLock = null;

function restBeep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (t, f) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.25, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.35);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.4);
    };
    beep(0, 880); beep(0.45, 880); beep(0.9, 1175);
  } catch {}
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

function closeRest() {
  clearInterval(restTimer);
  restTimer = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  document.querySelector('.rest')?.remove();
}

function openRestPicker() {
  closeRest();
  const el = document.createElement('div');
  el.className = 'rest';
  el.innerHTML = `
    <h2>Rest</h2>
    <div class="sub">Pick how long &mdash; the screen stays here<br>so your phone can't steal the rest.</div>
    <div class="rest-durs">
      ${[30, 60, 120, 180, 240, 300].map((s) =>
        `<button data-rest="${s}">${s < 60 ? s + 's' : (s / 60) + ':00'}</button>`).join('')}
    </div>
    <button class="rest-cancel">Cancel</button>`;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-rest]');
    if (b) { startRest(parseInt(b.dataset.rest, 10)); return; }
    if (e.target.closest('.rest-cancel')) closeRest();
  });
  document.body.appendChild(el);
}

function startRest(seconds) {
  closeRest();
  const el = document.createElement('div');
  el.className = 'rest';
  el.innerHTML = `
    <div class="rest-count" id="restCount"></div>
    <div class="rest-track"><div class="rest-fill" id="restFill" style="width:100%"></div></div>
    <div class="ad-slot" id="adSlot">Ad space<br>(plug your ad network in here)</div>
    <button class="rest-skip">Skip rest</button>`;
  el.querySelector('.rest-skip').addEventListener('click', closeRest);
  document.body.appendChild(el);

  if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { wakeLock = l; }).catch(() => {});

  const end = Date.now() + seconds * 1000;
  const count = el.querySelector('#restCount');
  const fill = el.querySelector('#restFill');
  const tick = () => {
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left / 1000);
    count.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    fill.style.width = (left / (seconds * 1000) * 100) + '%';
    if (left <= 0) {
      clearInterval(restTimer);
      restTimer = null;
      restBeep();
      count.textContent = '0:00';
      el.querySelector('.rest-skip').remove();
      el.insertAdjacentHTML('beforeend', '<div class="rest-done">Rest over — back to work</div>');
      setTimeout(closeRest, 2500);
    }
  };
  tick();
  restTimer = setInterval(tick, 250);
}

$('restBtn').addEventListener('click', openRestPicker);

/* ================= line chart (SVG) ================= */
function drawChart(wrap, points, mUnit) {
  const W = 520, H = 240, padL = 40, padR = 14, padT = 12, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;

  if (points.length === 1) points = [points[0], points[0]];

  const xs = points.map((p) => new Date(p.date + 'T12:00:00').getTime());
  const minX = Math.min(...xs), maxX = Math.max(...xs) || minX + 1;
  const spanX = (maxX - minX) || 1;

  let minV = Math.min(...points.map((p) => p.v));
  let maxV = Math.max(...points.map((p) => p.v));
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const vpad = (maxV - minV) * 0.15;
  minV = Math.max(0, minV - vpad); maxV += vpad;

  const rawStep = (maxV - minV) / 3;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rawStep) || rawStep;
  const y0 = Math.floor(minV / step) * step;
  const ticks = [];
  for (let t = y0; t <= maxV + 1e-9; t += step) if (t >= minV - 1e-9) ticks.push(Math.round(t * 100) / 100);

  const X = (t) => padL + ((t - minX) / spanX) * iw;
  const Y = (v) => padT + ih - ((v - minV) / (maxV - minV)) * ih;

  const px = points.map((p, i) => ({ x: X(xs[i]), y: Y(p.v), ...p }));
  const path = px.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  const xLabels = [px[0], px[px.length - 1]];
  if (px.length > 4) xLabels.splice(1, 0, px[Math.floor(px.length / 2)]);

  wrap.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress line chart">
    ${ticks.map((t) => `
      <line x1="${padL}" x2="${W - padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${padL - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1"/>
    ${xLabels.map((p) => `<text x="${p.x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtShort(p.date)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${px.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--page)" stroke-width="2"/>`).join('')}
    <line id="crossX" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1" style="display:none"/>
    <circle id="hoverDot" r="5" fill="var(--accent)" stroke="var(--page)" stroke-width="2" style="display:none"/>
  </svg>
  <div class="tip" id="tip"></div>`;

  const svg = wrap.querySelector('svg');
  const tip = wrap.querySelector('#tip');
  const crossX = wrap.querySelector('#crossX');
  const hoverDot = wrap.querySelector('#hoverDot');

  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = ((clientX - r.left) / r.width) * W;
    let nearest = px[0];
    for (const p of px) if (Math.abs(p.x - sx) < Math.abs(nearest.x - sx)) nearest = p;
    crossX.setAttribute('x1', nearest.x); crossX.setAttribute('x2', nearest.x);
    crossX.style.display = 'block';
    hoverDot.setAttribute('cx', nearest.x); hoverDot.setAttribute('cy', nearest.y);
    hoverDot.style.display = 'block';
    tip.innerHTML = `${nearest.v} ${mUnit} <span class="d">&middot; ${fmtShort(nearest.date)}</span>`;
    tip.style.display = 'block';
    const left = (nearest.x / W) * r.width;
    const top = (nearest.y / H) * r.height;
    tip.style.left = Math.max(48, Math.min(r.width - 48, left)) + 'px';
    tip.style.top = Math.max(30, top - 10) + 'px';
  };
  const hide = () => { tip.style.display = crossX.style.display = hoverDot.style.display = 'none'; };

  svg.addEventListener('pointermove', (e) => show(e.clientX));
  svg.addEventListener('pointerdown', (e) => show(e.clientX));
  svg.addEventListener('pointerleave', hide);
}

/* ================= events ================= */
main.addEventListener('click', (e) => {
  const mb = e.target.closest('[data-mode]');
  if (mb) { mode = mb.dataset.mode; localStorage.setItem(MODE_KEY, mode); render(); return; }
  const wk = e.target.closest('[data-dow]');
  if (wk) {
    if (!plans.length) { newPlan(); return; }
    // tap a weekday: select it — today's plan goes on the sheet, other days just preview
    selDow = parseInt(wk.dataset.dow, 10);
    const date = dateForDow(selDow);
    if (date === todayStr()) applyPlanToDate(date, weekMap[selDow]);
    render();
    return;
  }
  const ac = e.target.closest('[data-assign]');
  if (ac) {
    // assign a plan (or Rest) to the selected weekday
    const pid = ac.dataset.assign || undefined;
    if (pid) weekMap[selDow] = pid; else delete weekMap[selDow];
    persistPlans();
    const date = dateForDow(selDow);
    if (date === todayStr()) applyPlanToDate(date, pid);
    render();
    return;
  }
  const pl = e.target.closest('[data-plan]');
  if (pl) { view = { screen: 'plan', planId: pl.dataset.plan }; render(); return; }
  if (e.target.closest('[data-newplan]')) { newPlan(); return; }
  const det = e.target.closest('[data-detail]');
  if (det) { view = { screen: 'detail', exercise: det.dataset.detail }; render(); return; }
  const day = e.target.closest('[data-day]');
  if (day) {
    view = { screen: 'log' };
    render();
    const el = $('day-' + day.dataset.day);
    if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' });
  }
});
$('tabLog').addEventListener('click', () => { if (view.screen === 'plan') leavePlanEditor(); view = { screen: 'log' }; render(); });
$('tabProgress').addEventListener('click', () => { if (view.screen === 'plan') leavePlanEditor(); persist(); view = { screen: 'progress' }; render(); });
$('tabPics').addEventListener('click', () => { if (view.screen === 'plan') leavePlanEditor(); persist(); view = { screen: 'pics' }; render(); });
$('backBtn').addEventListener('click', () => {
  if (view.screen === 'plan') { leavePlanEditor(); view = { screen: 'log' }; }
  else view = { screen: 'progress' };
  render();
});
/* converting a whole set line's weights when the unit setting flips */
function convertLine(s, to) {
  return s.replace(/(\d+(?:\.\d+)?)\s*(kg|lbs?)?\s*(?=[x×]|(?:for|fir|fur|fro|fot)\b)/gi, (m, num, u) => {
    const from = u ? (u.toLowerCase().startsWith('k') ? 'kg' : 'lb') : (to === 'lb' ? 'kg' : 'lb');
    const v = parseFloat(num);
    if (from === to) return num + ' ';
    return String(Math.round((from === 'kg' ? v * 2.20462 : v / 2.20462) * 10) / 10) + ' ';
  });
}

$('unitBtn').addEventListener('click', () => {
  const to = unit === 'lb' ? 'kg' : 'lb';
  $('unitConfirmMsg').textContent = `Convert everything ${unit} → ${to}?`;
  $('unitConfirm').classList.remove('hidden');
  $('unitBtn').classList.add('hidden');
});
$('unitNo').addEventListener('click', () => {
  $('unitConfirm').classList.add('hidden');
  $('unitBtn').classList.remove('hidden');
});
$('unitYes').addEventListener('click', () => {
  const to = unit === 'lb' ? 'kg' : 'lb';
  sessions.forEach((s) => s.rows.forEach((r) => {
    r.sets = r.sets.map((x) => convertLine(x, to));
  }));
  unit = to;
  localStorage.setItem(UNIT_KEY, unit);
  persist();
  $('unitConfirm').classList.add('hidden');
  $('unitBtn').classList.remove('hidden');
  render();
});
window.addEventListener('pagehide', persist);

render();
