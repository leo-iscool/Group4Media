<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>
<meta name="description" content="A dead-simple workout notebook that tracks your weight, sets and reps per exercise.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.12);
  --danger: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.18);
    --danger: #e66767;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink);
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn { font-size: 15px; font-weight: 600; color: var(--accent); padding: 6px 8px 6px 0; display: none; }
.unit-btn {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  background: var(--surface);
}

main { padding: 16px 16px 120px; max-width: 560px; margin: 0 auto; }

.empty { text-align: center; color: var(--muted); padding: 64px 24px; line-height: 1.6; font-size: 15px; }
.empty strong { color: var(--ink-2); display: block; font-size: 17px; margin-bottom: 6px; }

.day-head { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 20px 4px 8px; }
.day-head:first-child { margin-top: 4px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  display: block;
}
.card .name { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
.card .sets { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.card .note { font-size: 13px; color: var(--muted); margin-top: 4px; font-style: italic; }

.ex-row { display: flex; align-items: center; gap: 12px; }
.ex-row .grow { flex: 1; min-width: 0; }
.ex-row .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
.ex-row .big { font-size: 17px; font-weight: 700; white-space: nowrap; }
.ex-row .big small { font-size: 12px; font-weight: 600; color: var(--muted); }
.chev { color: var(--muted); font-size: 18px; }

.fab {
  position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 30px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabbar button.active { color: var(--accent); }
.tabbar svg { width: 24px; height: 24px; }

/* ---- Detail view ---- */
.stats { display: flex; gap: 8px; margin-bottom: 16px; }
.stat {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 8px; text-align: center;
}
.stat .v { font-size: 20px; font-weight: 700; }
.stat .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat .k { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }

.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 12px 8px; margin-bottom: 16px;
}
.chart-title { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 0 6px 8px; }
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip {
  position: absolute; pointer-events: none; display: none;
  background: var(--ink); color: var(--page);
  font-size: 12px; font-weight: 600; line-height: 1.4;
  padding: 6px 9px; border-radius: 8px; white-space: nowrap;
  transform: translate(-50%, -100%); z-index: 3;
}
.tip .d { font-weight: 500; opacity: 0.75; }
.section-head { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 20px 4px 8px; }

/* ---- Sheet (add / edit) ---- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9; display: none; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
  max-height: 88vh; overflow-y: auto;
  transform: translateY(105%); transition: transform 0.25s ease;
  max-width: 560px; margin: 0 auto;
}
.sheet.open { transform: translateY(0); }
.scrim.open { display: block; }
.sheet h2 { font-size: 18px; margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
.field input {
  width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--page); font-size: 16px;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.set-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-row .idx { width: 24px; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }
.set-row input { flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--page); font-size: 16px; text-align: center; }
.set-row .x { color: var(--muted); font-size: 13px; }
.set-row .rm { color: var(--muted); font-size: 20px; padding: 4px 8px; }
.add-set { color: var(--accent); font-weight: 650; font-size: 15px; padding: 8px 4px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn-primary {
  flex: 1; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
  padding: 14px; border-radius: 12px;
}
.btn-danger { color: var(--danger); font-weight: 650; font-size: 15px; padding: 14px 16px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" id="backBtn">&#8249; Back</button>
  <h1 id="title">Lift Log</h1>
  <button class="unit-btn" id="unitBtn">lb</button>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="Add workout">+</button>

<nav class="tabbar">
  <button id="tabLog" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5z M9 8h6 M9 12h6 M9 16h4"/></svg>
    Log
  </button>
  <button id="tabProgress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 10 12l4 3 6-8"/><path d="M4 21h16" opacity="0.4"/></svg>
    Progress
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">New entry</h2>
  <div class="field">
    <label for="fName">Exercise</label>
    <input id="fName" type="text" placeholder="e.g. Bench Press" list="exNames" autocomplete="off" enterkeyhint="next">
    <datalist id="exNames"></datalist>
  </div>
  <div class="field">
    <label for="fDate">Date</label>
    <input id="fDate" type="date">
  </div>
  <div class="field">
    <label>Sets &mdash; weight (<span id="setUnitLabel">lb</span>) &times; reps</label>
    <div id="setRows"></div>
    <button class="add-set" id="addSetBtn">+ Add set</button>
  </div>
  <div class="field">
    <label for="fNote">Note (optional)</label>
    <input id="fNote" type="text" placeholder="Felt easy, add weight next time" enterkeyhint="done">
  </div>
  <div class="sheet-actions">
    <button class="btn-danger hidden" id="deleteBtn">Delete</button>
    <button class="btn-primary" id="saveBtn">Save</button>
  </div>
</div>

<script>
'use strict';

/* ---------------- storage ---------------- */
const KEY = 'liftlog.entries.v1';
const UNIT_KEY = 'liftlog.unit';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (entries) => localStorage.setItem(KEY, JSON.stringify(entries));

let entries = load();               // [{id, date:'YYYY-MM-DD', exercise, sets:[{w,r}], note, ts}]
let unit = localStorage.getItem(UNIT_KEY) || 'lb';
let view = { screen: 'log', exercise: null };   // 'log' | 'progress' | 'detail'
let editingId = null;

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmtDay = (iso) => {
  const t = todayStr();
  if (iso === t) return 'Today';
  const y = new Date(Date.now() - 864e5);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  if (iso === yStr) return 'Yesterday';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
};
const fmtShort = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const num = (v) => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; };
const setsText = (sets) =>
  sets.map((s) => s.w > 0 ? `${s.w}${unit} × ${s.r}` : `${s.r} reps`).join(', ');

// Progress metric per entry: top weight, or top reps if this exercise is bodyweight-only
const topWeight = (e) => Math.max(0, ...e.sets.map((s) => s.w));
const topReps = (e) => Math.max(0, ...e.sets.map((s) => s.r));

const exerciseNames = () => {
  const seen = new Map();  // lowercase -> display name (latest wins)
  entries.slice().sort((a, b) => a.ts - b.ts).forEach((e) => seen.set(e.exercise.toLowerCase(), e.exercise));
  return [...seen.values()];
};
const entriesFor = (name) =>
  entries.filter((e) => e.exercise.toLowerCase() === name.toLowerCase())
         .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts);

/* ---------------- rendering ---------------- */
const main = $('main');

function render() {
  $('backBtn').style.display = view.screen === 'detail' ? 'block' : 'none';
  $('fab').style.display = view.screen === 'progress' ? 'none' : 'flex';
  $('tabLog').classList.toggle('active', view.screen === 'log');
  $('tabProgress').classList.toggle('active', view.screen !== 'log');
  $('unitBtn').textContent = unit;

  if (view.screen === 'log') { $('title').textContent = 'Lift Log'; renderLog(); }
  else if (view.screen === 'progress') { $('title').textContent = 'Progress'; renderProgress(); }
  else { $('title').textContent = view.exercise; renderDetail(view.exercise); }
}

function renderLog() {
  if (!entries.length) {
    main.innerHTML = `<div class="empty"><strong>No workouts yet</strong>Tap + to jot down your first exercise &mdash; weight, sets and reps.</div>`;
    return;
  }
  const byDate = {};
  entries.slice().sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : b.ts - a.ts)
    .forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  main.innerHTML = Object.keys(byDate).map((d) =>
    `<div class="day-head">${fmtDay(d)}</div>` +
    byDate[d].map((e) => `
      <button class="card" data-edit="${e.id}">
        <div class="name">${esc(e.exercise)}</div>
        <div class="sets">${esc(setsText(e.sets))}</div>
        ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
      </button>`).join('')
  ).join('');
}

function renderProgress() {
  const names = exerciseNames();
  if (!names.length) {
    main.innerHTML = `<div class="empty"><strong>Nothing to chart yet</strong>Log a workout first, then come back to see your progress per exercise.</div>`;
    return;
  }
  main.innerHTML = names.map((n) => {
    const list = entriesFor(n);
    const last = list[list.length - 1];
    const bw = list.every((e) => topWeight(e) === 0);
    const best = Math.max(...list.map((e) => bw ? topReps(e) : topWeight(e)));
    return `
      <button class="card" data-detail="${esc(n)}">
        <div class="ex-row">
          <div class="grow">
            <div class="name">${esc(n)}</div>
            <div class="meta">${list.length} session${list.length === 1 ? '' : 's'} &middot; last ${fmtShort(last.date)}</div>
          </div>
          <div class="big">${best}<small> ${bw ? 'reps' : unit}</small></div>
          <div class="chev">&#8250;</div>
        </div>
      </button>`;
  }).join('');
}

function renderDetail(name) {
  const list = entriesFor(name);
  if (!list.length) { view = { screen: 'progress', exercise: null }; render(); return; }
  const bw = list.every((e) => topWeight(e) === 0);
  const metric = (e) => bw ? topReps(e) : topWeight(e);
  const mUnit = bw ? 'reps' : unit;

  // one point per day (best of day)
  const byDay = {};
  list.forEach((e) => { byDay[e.date] = Math.max(byDay[e.date] || 0, metric(e)); });
  const points = Object.keys(byDay).sort().map((d) => ({ date: d, v: byDay[d] }));

  const best = Math.max(...points.map((p) => p.v));
  const last = points[points.length - 1].v;
  const first = points[0].v;
  const delta = last - first;

  main.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${last}<small> ${mUnit}</small></div><div class="k">Last</div></div>
      <div class="stat"><div class="v">${best}<small> ${mUnit}</small></div><div class="k">Best</div></div>
      <div class="stat"><div class="v">${delta >= 0 ? '+' : ''}${Math.round(delta * 10) / 10}<small> ${mUnit}</small></div><div class="k">Since start</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Top ${bw ? 'reps' : 'set weight'} over time</div>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <div class="section-head">History</div>
    ${list.slice().reverse().map((e) => `
      <button class="card" data-edit="${e.id}">
        <div class="ex-row">
          <div class="grow">
            <div class="sets">${esc(setsText(e.sets))}</div>
            ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
          </div>
          <div class="meta">${fmtShort(e.date)}</div>
        </div>
      </button>`).join('')}`;

  drawChart($('chartWrap'), points, mUnit);
}

/* ---------------- line chart (SVG) ---------------- */
function drawChart(wrap, points, mUnit) {
  const W = 520, H = 240, padL = 40, padR = 14, padT = 12, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;

  if (points.length === 1) points = [points[0], points[0]]; // still draw a flat hint

  const xs = points.map((p) => new Date(p.date + 'T12:00:00').getTime());
  const minX = Math.min(...xs), maxX = Math.max(...xs) || minX + 1;
  const spanX = (maxX - minX) || 1;

  let minV = Math.min(...points.map((p) => p.v));
  let maxV = Math.max(...points.map((p) => p.v));
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const pad = (maxV - minV) * 0.15;
  minV = Math.max(0, minV - pad); maxV += pad;

  // nice y ticks (4)
  const rawStep = (maxV - minV) / 3;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rawStep) || rawStep;
  const y0 = Math.floor(minV / step) * step;
  const ticks = [];
  for (let t = y0; t <= maxV + 1e-9; t += step) if (t >= minV - 1e-9) ticks.push(Math.round(t * 100) / 100);

  const X = (t) => padL + ((t - minX) / spanX) * iw;
  const Y = (v) => padT + ih - ((v - minV) / (maxV - minV)) * ih;

  const px = points.map((p, i) => ({ x: X(xs[i]), y: Y(p.v), ...p }));
  const path = px.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  // x labels: first, last, and a middle one if room
  const xLabels = [px[0], px[px.length - 1]];
  if (px.length > 4) xLabels.splice(1, 0, px[Math.floor(px.length / 2)]);

  wrap.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress line chart">
    ${ticks.map((t) => `
      <line x1="${padL}" x2="${W - padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${padL - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1"/>
    ${xLabels.map((p) => `<text x="${p.x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtShort(p.date)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${px.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    <line id="crossX" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1" style="display:none"/>
    <circle id="hoverDot" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
  </svg>
  <div class="tip" id="tip"></div>`;

  // crosshair + tooltip
  const svg = wrap.querySelector('svg');
  const tip = wrap.querySelector('#tip');
  const crossX = wrap.querySelector('#crossX');
  const hoverDot = wrap.querySelector('#hoverDot');

  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = ((clientX - r.left) / r.width) * W;
    let nearest = px[0];
    for (const p of px) if (Math.abs(p.x - sx) < Math.abs(nearest.x - sx)) nearest = p;
    crossX.setAttribute('x1', nearest.x); crossX.setAttribute('x2', nearest.x);
    crossX.style.display = 'block';
    hoverDot.setAttribute('cx', nearest.x); hoverDot.setAttribute('cy', nearest.y);
    hoverDot.style.display = 'block';
    tip.innerHTML = `${nearest.v} ${mUnit} <span class="d">&middot; ${fmtShort(nearest.date)}</span>`;
    tip.style.display = 'block';
    const left = (nearest.x / W) * r.width;
    const top = (nearest.y / H) * r.height;
    tip.style.left = Math.max(48, Math.min(r.width - 48, left)) + 'px';
    tip.style.top = Math.max(30, top - 10) + 'px';
  };
  const hide = () => { tip.style.display = crossX.style.display = hoverDot.style.display = 'none'; };

  svg.addEventListener('pointermove', (e) => show(e.clientX));
  svg.addEventListener('pointerdown', (e) => show(e.clientX));
  svg.addEventListener('pointerleave', hide);
}

/* ---------------- sheet (add / edit) ---------------- */
const sheet = $('sheet'), scrim = $('scrim'), setRows = $('setRows');

function setRowHTML(w, r, i) {
  return `<div class="set-row">
    <span class="idx">${i + 1}</span>
    <input type="number" inputmode="decimal" step="any" min="0" placeholder="weight" class="in-w" value="${w !== '' ? w : ''}">
    <span class="x">&times;</span>
    <input type="number" inputmode="numeric" min="0" placeholder="reps" class="in-r" value="${r !== '' ? r : ''}">
    <button class="rm" data-rm aria-label="Remove set">&#10005;</button>
  </div>`;
}
function reindexRows() {
  [...setRows.querySelectorAll('.set-row .idx')].forEach((el, i) => el.textContent = i + 1);
}
function addSetRow(w = '', r = '') {
  setRows.insertAdjacentHTML('beforeend', setRowHTML(w, r, setRows.children.length));
}

function openSheet(entry) {
  editingId = entry ? entry.id : null;
  $('sheetTitle').textContent = entry ? 'Edit entry' : 'New entry';
  $('deleteBtn').classList.toggle('hidden', !entry);
  $('fName').value = entry ? entry.exercise : (view.screen === 'detail' ? view.exercise : '');
  $('fDate').value = entry ? entry.date : todayStr();
  $('fNote').value = entry ? (entry.note || '') : '';
  $('setUnitLabel').textContent = unit;
  setRows.innerHTML = '';
  if (entry) entry.sets.forEach((s) => addSetRow(s.w || '', s.r || ''));
  else addSetRow();
  $('exNames').innerHTML = exerciseNames().map((n) => `<option value="${esc(n)}">`).join('');
  scrim.classList.add('open'); sheet.classList.add('open');
  if (!entry && !$('fName').value) setTimeout(() => $('fName').focus(), 250);
}
function closeSheet() { scrim.classList.remove('open'); sheet.classList.remove('open'); editingId = null; }

function saveSheet() {
  const name = $('fName').value.trim();
  if (!name) { $('fName').focus(); return; }
  const sets = [...setRows.querySelectorAll('.set-row')].map((row) => ({
    w: num(row.querySelector('.in-w').value),
    r: Math.round(num(row.querySelector('.in-r').value))
  })).filter((s) => s.w > 0 || s.r > 0);
  if (!sets.length) { setRows.querySelector('.in-w')?.focus(); return; }
  const date = $('fDate').value || todayStr();
  const note = $('fNote').value.trim();

  if (editingId) {
    const e = entries.find((x) => x.id === editingId);
    if (e) Object.assign(e, { exercise: name, date, sets, note });
  } else {
    entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), exercise: name, date, sets, note, ts: Date.now() });
  }
  save(entries);
  closeSheet();
  render();
}

/* ---------------- events ---------------- */
$('fab').addEventListener('click', () => openSheet(null));
$('addSetBtn').addEventListener('click', () => {
  const rows = setRows.querySelectorAll('.set-row');
  const lastRow = rows[rows.length - 1];
  addSetRow(lastRow ? lastRow.querySelector('.in-w').value : '', lastRow ? lastRow.querySelector('.in-r').value : '');
});
setRows.addEventListener('click', (e) => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { rm.closest('.set-row').remove(); if (!setRows.children.length) addSetRow(); reindexRows(); }
});
$('saveBtn').addEventListener('click', saveSheet);
$('deleteBtn').addEventListener('click', () => {
  if (!editingId) return;
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter((x) => x.id !== editingId);
  save(entries);
  closeSheet();
  if (view.screen === 'detail' && !entriesFor(view.exercise).length) view = { screen: 'progress', exercise: null };
  render();
});
scrim.addEventListener('click', closeSheet);

main.addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]');
  if (edit) { openSheet(entries.find((x) => x.id === edit.dataset.edit)); return; }
  const det = e.target.closest('[data-detail]');
  if (det) { view = { screen: 'detail', exercise: det.dataset.detail }; render(); }
});
$('tabLog').addEventListener('click', () => { view = { screen: 'log', exercise: null }; render(); });
$('tabProgress').addEventListener('click', () => { view = { screen: 'progress', exercise: null }; render(); });
$('backBtn').addEventListener('click', () => { view = { screen: 'progress', exercise: null }; render(); });
$('unitBtn').addEventListener('click', () => {
  unit = unit === 'lb' ? 'kg' : 'lb';
  localStorage.setItem(UNIT_KEY, unit);
  $('setUnitLabel').textContent = unit;
  render();
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
