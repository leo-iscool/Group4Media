<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>
<meta name="description" content="A dead-simple workout notebook: just type what you did and it tracks weight, sets and reps per exercise.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --danger: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.16);
    --danger: #e66767;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink);
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  background: var(--page);
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn { font-size: 15px; font-weight: 600; color: var(--accent); padding: 6px 8px 6px 0; display: none; }
.unit-btn {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  background: var(--surface);
}

main { padding: 16px 16px 120px; max-width: 560px; margin: 0 auto; }

.empty { text-align: center; color: var(--muted); padding: 56px 24px; line-height: 1.6; font-size: 15px; }
.empty strong { color: var(--ink-2); display: block; font-size: 17px; margin-bottom: 6px; }
.empty code { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 13px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  width: 100%;
  text-align: left;
  display: block;
}
.note-date { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
.note-line { font-size: 15px; line-height: 1.45; margin-bottom: 6px; }
.note-line:last-child { margin-bottom: 0; }
.note-line .nm { font-weight: 650; }
.note-line .st { color: var(--ink-2); }
.note-line.plain { color: var(--muted); font-style: italic; font-size: 14px; }

.ex-row { display: flex; align-items: center; gap: 12px; }
.ex-row .grow { flex: 1; min-width: 0; }
.ex-row .name { font-size: 16px; font-weight: 650; }
.ex-row .meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
.ex-row .big { font-size: 17px; font-weight: 700; white-space: nowrap; }
.ex-row .big small { font-size: 12px; font-weight: 600; color: var(--muted); }
.chev { color: var(--muted); font-size: 18px; }

.fab {
  position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 30px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  flex: 1; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabbar button.active { color: var(--accent); }
.tabbar svg { width: 24px; height: 24px; }

/* ---- Editor (the note) ---- */
.date-btn {
  display: inline-block; font-size: 13px; font-weight: 650; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 12px; margin-bottom: 12px; position: relative;
}
.date-btn input {
  position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%;
}
.note-input {
  width: 100%; min-height: 140px; resize: none;
  background: transparent; border: none; outline: none;
  font-size: 17px; line-height: 1.6; caret-color: var(--accent);
}
.note-input::placeholder { color: var(--muted); }
.parsed { margin-top: 8px; }
.parsed-line {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px;
  padding: 10px 0; border-top: 1px solid var(--grid);
}
.parsed-line .nm { font-size: 15px; font-weight: 650; margin-right: 2px; }
.parsed-line.plain { color: var(--muted); font-style: italic; font-size: 14px; }
.chip {
  font-size: 12px; font-weight: 650; color: var(--accent);
  background: var(--accent-soft); border-radius: 999px; padding: 3px 9px;
  white-space: nowrap;
}
.chip.dim { color: var(--muted); background: transparent; border: 1px solid var(--border); font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 16px; }
.hint code { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
.del-note { display: block; margin: 28px auto 0; color: var(--danger); font-weight: 650; font-size: 14px; padding: 8px 16px; }

/* ---- Detail view ---- */
.stats { display: flex; gap: 8px; margin-bottom: 16px; }
.stat {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 8px; text-align: center;
}
.stat .v { font-size: 20px; font-weight: 700; }
.stat .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat .k { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 3px; }

.chart-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 12px 8px; margin-bottom: 16px;
}
.chart-title { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 0 6px 8px; }
.chart-wrap { position: relative; touch-action: pan-y; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.tip {
  position: absolute; pointer-events: none; display: none;
  background: var(--ink); color: var(--page);
  font-size: 12px; font-weight: 600; line-height: 1.4;
  padding: 6px 9px; border-radius: 8px; white-space: nowrap;
  transform: translate(-50%, -100%); z-index: 3;
}
.tip .d { font-weight: 500; opacity: 0.75; }
.section-head { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 20px 4px 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <button class="back-btn" id="backBtn">&#8249; Back</button>
  <h1 id="title">Lift Log</h1>
  <button class="unit-btn" id="unitBtn">lb</button>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="New note">+</button>

<nav class="tabbar">
  <button id="tabLog" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5z M9 8h6 M9 12h6 M9 16h4"/></svg>
    Log
  </button>
  <button id="tabProgress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 10 12l4 3 6-8"/><path d="M4 21h16" opacity="0.4"/></svg>
    Progress
  </button>
</nav>

<script>
'use strict';

/* ================= storage ================= */
const KEY = 'liftlog.notes.v2';
const OLD_KEY = 'liftlog.entries.v1';
const UNIT_KEY = 'liftlog.unit';

function migrate() {
  if (localStorage.getItem(KEY)) return;
  let old;
  try { old = JSON.parse(localStorage.getItem(OLD_KEY)); } catch { old = null; }
  if (!old || !old.length) return;
  const byDate = {};
  old.sort((a, b) => a.ts - b.ts).forEach((e) => {
    const line = `${e.exercise} ` + e.sets.map((s) => s.w > 0 ? `${s.w}x${s.r}` : `${s.r}`).join(' ')
      + (e.note ? `\n${e.note}` : '');
    byDate[e.date] = byDate[e.date] ? byDate[e.date] + '\n' + line : line;
  });
  const notes = Object.keys(byDate).map((d, i) => ({ id: 'm' + i, date: d, text: byDate[d], ts: Date.now() }));
  localStorage.setItem(KEY, JSON.stringify(notes));
}
migrate();

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const persist = () => localStorage.setItem(KEY, JSON.stringify(notes));

let notes = load();                 // [{id, date:'YYYY-MM-DD', text, ts}]
let unit = localStorage.getItem(UNIT_KEY) || 'lb';
let view = { screen: 'log', noteId: null, exercise: null };  // log | edit | progress | detail

/* ================= helpers ================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const fmtDay = (iso) => {
  const t = todayStr();
  if (iso === t) return 'Today';
  const y = new Date(Date.now() - 864e5);
  const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  if (iso === yStr) return 'Yesterday';
  return new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
};
const fmtShort = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

/* ================= the parser =================
   Turns a free-typed line like
     "Bench Press 135x8 135x6"      -> weight x reps, one set each
     "Squat 3x5 @ 185"              -> 3 sets of 5 at 185
     "Deadlift 225x5x3"             -> 225 for 5 reps, 3 sets
     "Pull-ups 10, 8, 6"            -> bodyweight, reps only
     "OHP 95x8 6 5"                 -> 95 for 8, then 6, then 5
   into { name, sets:[{w,r}], comment } — or a plain note line. */
const NUM_TOKS = /(\d+(?:\.\d+)?)\s*(kg|lbs?|#)?\s*x\s*(\d+(?:\.\d+)?)(?:\s*x\s*(\d+(?:\.\d+)?))?|@\s*(\d+(?:\.\d+)?)\s*(kg|lbs?|#)?|(\d+(?:\.\d+)?)\s*(kg|lbs?|#)?/gi;

function parseLine(rawLine) {
  const raw = rawLine.trim();
  if (!raw) return null;
  const norm = raw.replace(/×/g, 'x');
  const head = norm.match(/^([^\d@]*)/)[1];
  const name = head.replace(/[\s:,\-–—]+$/, '').trim();
  const rest = norm.slice(head.length);
  if (!rest.trim()) return { type: 'note', text: raw };

  const sets = [];
  let atWeight = null;       // "@ 185"
  let preWeight = null;      // bare number before any pair: "Bench 225 5x5"
  let mode = null;           // after a pair: 'w' (bares = more reps) | 's' (bare = the weight)
  let lastSetsGroup = null;  // sets awaiting a weight (sets-mode)
  let bareReps = [];         // bare numbers with no pair context
  let lastEnd = 0;
  NUM_TOKS.lastIndex = 0;
  let m;
  while ((m = NUM_TOKS.exec(rest)) !== null) {
    lastEnd = m.index + m[0].length;
    if (m[1] !== undefined) {                      // A x B (x C)
      const a = parseFloat(m[1]), b = parseFloat(m[3]);
      const aHasUnit = !!m[2];
      if (m[4] !== undefined) {                    // triple A x B x C
        const c = parseFloat(m[4]);
        if (a >= 25 || aHasUnit) for (let i = 0; i < c; i++) sets.push({ w: a, r: b });
        else for (let i = 0; i < a; i++) sets.push({ w: c, r: b });
        mode = 'w'; lastSetsGroup = null;
      } else if (!aHasUnit && a <= 12 && b <= 50 && a === Math.round(a)) {
        // sets x reps — weight comes from @, a bare number, or bodyweight
        if (atWeight === null && preWeight === null && bareReps.length === 1) {
          preWeight = bareReps[0]; bareReps = [];   // "Bench 225 5x5"
        }
        const group = [];
        for (let i = 0; i < a; i++) { const s = { w: atWeight ?? preWeight ?? 0, r: b }; sets.push(s); group.push(s); }
        lastSetsGroup = (atWeight === null && preWeight === null) ? group : null;
        mode = 's';
      } else {                                     // weight x reps
        sets.push({ w: a, r: b });
        mode = 'w'; lastSetsGroup = null;
      }
    } else if (m[5] !== undefined) {               // @ weight
      atWeight = parseFloat(m[5]);
      if (lastSetsGroup) { lastSetsGroup.forEach((s) => s.w = atWeight); lastSetsGroup = null; }
    } else {                                       // bare number
      const v = parseFloat(m[7]);
      const hasUnit = !!m[8];
      if (mode === 'w' && !hasUnit) {
        sets.push({ w: sets.length ? sets[sets.length - 1].w : 0, r: v });
      } else if (mode === 's' || (mode === null && hasUnit)) {
        if (lastSetsGroup) { lastSetsGroup.forEach((s) => s.w = v); lastSetsGroup = null; }
        else if (mode === null) preWeight = v;
      } else if (mode === null) {
        if (hasUnit) preWeight = v; else bareReps.push(v);
      }
    }
  }
  if (!sets.length && bareReps.length) {
    // reps-only line: "Pull-ups 10, 8, 6" (or with @/leading weight)
    bareReps.forEach((r) => sets.push({ w: atWeight ?? preWeight ?? 0, r }));
  } else if (!sets.length && (atWeight !== null || preWeight !== null)) {
    sets.push({ w: atWeight ?? preWeight, r: 1 });  // just a weight: one single
  }
  if (!sets.length) return { type: 'note', text: raw };

  let comment = rest.slice(lastEnd).replace(/^[\s,.;\-–—)]+/, '').trim();
  if (/^(kg|lbs?|#|reps?|sets?)$/i.test(comment)) comment = '';
  if (!name) return { type: 'cont', sets, comment };  // continuation line, attach to previous
  return { type: 'entry', name, sets: sets.map((s) => ({ w: s.w, r: s.r })), comment };
}

function parseText(text) {
  const items = [];
  for (const line of text.split('\n')) {
    const p = parseLine(line);
    if (!p) continue;
    if (p.type === 'cont') {
      const prev = [...items].reverse().find((i) => i.type === 'entry');
      if (prev) { prev.sets.push(...p.sets); if (p.comment) prev.comment = (prev.comment ? prev.comment + ' ' : '') + p.comment; }
      else items.push({ type: 'note', text: line.trim() });
    } else items.push(p);
  }
  return items;
}

/* grouped display: consecutive same-weight sets fold together */
function groupSets(sets) {
  const gs = [];
  sets.forEach((s) => {
    const g = gs[gs.length - 1];
    if (g && g.w === s.w) g.reps.push(s.r);
    else gs.push({ w: s.w, reps: [s.r] });
  });
  return gs;
}
const setsText = (sets) => groupSets(sets)
  .map((g) => g.w > 0 ? `${g.w}${unit} × ${g.reps.join(', ')}` : `${g.reps.join(', ')} reps`)
  .join(' &middot; ');

function chipsHTML(sets) {
  const n = sets.length;
  const ws = [...new Set(sets.map((s) => s.w).filter((w) => w > 0))];
  const reps = sets.map((s) => s.r);
  let out = `<span class="chip">${n} set${n === 1 ? '' : 's'}</span>`;
  if (ws.length) out += `<span class="chip">${Math.min(...ws) === Math.max(...ws) ? ws[0] : Math.min(...ws) + '–' + Math.max(...ws)} ${unit}</span>`;
  out += `<span class="chip">${reps.join(' · ')} reps</span>`;
  return out;
}

/* ================= derived data (for Progress) ================= */
function allEntries() {
  const out = [];  // {date, name, sets, noteId}
  notes.forEach((n) => parseText(n.text).forEach((it) => {
    if (it.type === 'entry') out.push({ date: n.date, name: it.name, sets: it.sets, comment: it.comment, noteId: n.id });
  }));
  return out;
}
const topWeight = (e) => Math.max(0, ...e.sets.map((s) => s.w));
const topReps = (e) => Math.max(0, ...e.sets.map((s) => s.r));
function exerciseNames(entries) {
  const seen = new Map();
  entries.forEach((e) => seen.set(e.name.toLowerCase(), e.name));
  return [...seen.values()];
}

/* ================= rendering ================= */
const main = $('main');

function render() {
  const isSub = view.screen === 'detail' || view.screen === 'edit';
  $('backBtn').style.display = isSub ? 'block' : 'none';
  $('fab').style.display = view.screen === 'log' ? 'flex' : 'none';
  $('tabLog').classList.toggle('active', view.screen === 'log' || view.screen === 'edit');
  $('tabProgress').classList.toggle('active', view.screen === 'progress' || view.screen === 'detail');
  $('unitBtn').textContent = unit;

  if (view.screen === 'log') { $('title').textContent = 'Lift Log'; renderLog(); }
  else if (view.screen === 'edit') { renderEditor(); }
  else if (view.screen === 'progress') { $('title').textContent = 'Progress'; renderProgress(); }
  else { $('title').textContent = view.exercise; renderDetail(view.exercise); }
}

function renderLog() {
  if (!notes.length) {
    main.innerHTML = `<div class="empty"><strong>No workouts yet</strong>
      Tap + and just type what you did, like<br><code>Bench Press 135x8 135x6</code><br>
      It picks out the weight, sets and reps for you.</div>`;
    return;
  }
  const sorted = notes.slice().sort((a, b) => b.date < a.date ? -1 : b.date > a.date ? 1 : b.ts - a.ts);
  main.innerHTML = sorted.map((n) => {
    const items = parseText(n.text);
    const body = items.length ? items.map((it) =>
      it.type === 'entry'
        ? `<div class="note-line"><span class="nm">${esc(it.name)}</span> <span class="st">${setsText(it.sets)}</span></div>`
        : `<div class="note-line plain">${esc(it.text)}</div>`
    ).join('') : `<div class="note-line plain">Empty note</div>`;
    return `<button class="card" data-open="${n.id}">
      <div class="note-date">${fmtDay(n.date)}</div>${body}</button>`;
  }).join('');
}

/* ---- the notes editor: click anywhere, type ---- */
let editorNote = null;
let saveTimer = null;

function renderEditor() {
  editorNote = notes.find((n) => n.id === view.noteId);
  if (!editorNote) { view = { screen: 'log' }; render(); return; }
  $('title').textContent = fmtDay(editorNote.date);
  main.innerHTML = `
    <label class="date-btn">${fmtShort(editorNote.date)}
      <input type="date" id="edDate" value="${editorNote.date}">
    </label>
    <textarea class="note-input" id="edText" placeholder="Bench Press 135x8 135x6&#10;Squat 3x5 @ 185&#10;Pull-ups 10, 8, 6" autocapitalize="words">${esc(editorNote.text)}</textarea>
    <div class="parsed" id="parsed"></div>
    <div class="hint" id="edHint">Type one exercise per line &mdash; weight&times;reps like <code>135x8 135x6</code>, sets&times;reps like <code>3x5 @ 185</code>, or just reps like <code>10, 8, 6</code>. Anything else is kept as a note.</div>
    <button class="del-note" id="delNote">Delete note</button>`;
  const ta = $('edText');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(140, ta.scrollHeight) + 'px'; };
  grow();
  renderParsed();
  ta.addEventListener('input', () => {
    grow();
    editorNote.text = ta.value;
    editorNote.ts = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 250);
    renderParsed();
  });
  $('edDate').addEventListener('change', (e) => {
    if (!e.target.value) return;
    editorNote.date = e.target.value;
    persist();
    $('title').textContent = fmtDay(editorNote.date);
    e.target.closest('.date-btn').firstChild.textContent = fmtShort(editorNote.date);
  });
  $('delNote').addEventListener('click', () => {
    if (!confirm('Delete this note?')) return;
    notes = notes.filter((n) => n.id !== editorNote.id);
    persist();
    view = { screen: 'log' };
    render();
  });
  if (!editorNote.text) setTimeout(() => ta.focus(), 150);
}

function renderParsed() {
  const items = parseText(editorNote.text);
  $('parsed').innerHTML = items.map((it) =>
    it.type === 'entry'
      ? `<div class="parsed-line"><span class="nm">${esc(it.name)}</span>${chipsHTML(it.sets)}${it.comment ? `<span class="chip dim">${esc(it.comment)}</span>` : ''}</div>`
      : `<div class="parsed-line plain">${esc(it.text)}</div>`
  ).join('');
  $('edHint').style.display = items.some((i) => i.type === 'entry') ? 'none' : 'block';
}

function openNote(id) {
  clearTimeout(saveTimer);
  view = { screen: 'edit', noteId: id };
  render();
}
function newNote() {
  const t = todayStr();
  let n = notes.find((x) => x.date === t);
  if (!n) {
    n = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: t, text: '', ts: Date.now() };
    notes.push(n);
    persist();
  }
  openNote(n.id);
}
function leaveEditor() {
  clearTimeout(saveTimer);
  if (editorNote && !editorNote.text.trim()) notes = notes.filter((n) => n.id !== editorNote.id);
  persist();
  editorNote = null;
}

/* ---- progress ---- */
function renderProgress() {
  const entries = allEntries();
  const names = exerciseNames(entries);
  if (!names.length) {
    main.innerHTML = `<div class="empty"><strong>Nothing to chart yet</strong>Write down a workout first, then come back to see your progress per exercise.</div>`;
    return;
  }
  main.innerHTML = names.map((n) => {
    const list = entries.filter((e) => e.name.toLowerCase() === n.toLowerCase());
    const days = [...new Set(list.map((e) => e.date))].sort();
    const bw = list.every((e) => topWeight(e) === 0);
    const best = Math.max(...list.map((e) => bw ? topReps(e) : topWeight(e)));
    return `
      <button class="card" data-detail="${esc(n)}">
        <div class="ex-row">
          <div class="grow">
            <div class="name">${esc(n)}</div>
            <div class="meta">${days.length} session${days.length === 1 ? '' : 's'} &middot; last ${fmtShort(days[days.length - 1])}</div>
          </div>
          <div class="big">${best}<small> ${bw ? 'reps' : unit}</small></div>
          <div class="chev">&#8250;</div>
        </div>
      </button>`;
  }).join('');
}

function renderDetail(name) {
  const entries = allEntries().filter((e) => e.name.toLowerCase() === name.toLowerCase());
  if (!entries.length) { view = { screen: 'progress' }; render(); return; }
  entries.sort((a, b) => a.date < b.date ? -1 : 1);
  const bw = entries.every((e) => topWeight(e) === 0);
  const metric = (e) => bw ? topReps(e) : topWeight(e);
  const mUnit = bw ? 'reps' : unit;

  const byDay = {};
  entries.forEach((e) => { byDay[e.date] = Math.max(byDay[e.date] || 0, metric(e)); });
  const points = Object.keys(byDay).sort().map((d) => ({ date: d, v: byDay[d] }));

  const best = Math.max(...points.map((p) => p.v));
  const last = points[points.length - 1].v;
  const delta = last - points[0].v;

  main.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${last}<small> ${mUnit}</small></div><div class="k">Last</div></div>
      <div class="stat"><div class="v">${best}<small> ${mUnit}</small></div><div class="k">Best</div></div>
      <div class="stat"><div class="v">${delta >= 0 ? '+' : ''}${Math.round(delta * 10) / 10}<small> ${mUnit}</small></div><div class="k">Since start</div></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Top ${bw ? 'reps' : 'set weight'} over time</div>
      <div class="chart-wrap" id="chartWrap"></div>
    </div>
    <div class="section-head">History</div>
    ${entries.slice().reverse().map((e) => `
      <button class="card" data-open="${e.noteId}">
        <div class="ex-row">
          <div class="grow">
            <div class="note-line" style="margin:0"><span class="st">${setsText(e.sets)}</span></div>
            ${e.comment ? `<div class="meta">${esc(e.comment)}</div>` : ''}
          </div>
          <div class="meta">${fmtShort(e.date)}</div>
        </div>
      </button>`).join('')}`;

  drawChart($('chartWrap'), points, mUnit);
}

/* ================= line chart (SVG) ================= */
function drawChart(wrap, points, mUnit) {
  const W = 520, H = 240, padL = 40, padR = 14, padT = 12, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;

  if (points.length === 1) points = [points[0], points[0]];

  const xs = points.map((p) => new Date(p.date + 'T12:00:00').getTime());
  const minX = Math.min(...xs), maxX = Math.max(...xs) || minX + 1;
  const spanX = (maxX - minX) || 1;

  let minV = Math.min(...points.map((p) => p.v));
  let maxV = Math.max(...points.map((p) => p.v));
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const vpad = (maxV - minV) * 0.15;
  minV = Math.max(0, minV - vpad); maxV += vpad;

  const rawStep = (maxV - minV) / 3;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rawStep) || rawStep;
  const y0 = Math.floor(minV / step) * step;
  const ticks = [];
  for (let t = y0; t <= maxV + 1e-9; t += step) if (t >= minV - 1e-9) ticks.push(Math.round(t * 100) / 100);

  const X = (t) => padL + ((t - minX) / spanX) * iw;
  const Y = (v) => padT + ih - ((v - minV) / (maxV - minV)) * ih;

  const px = points.map((p, i) => ({ x: X(xs[i]), y: Y(p.v), ...p }));
  const path = px.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  const xLabels = [px[0], px[px.length - 1]];
  if (px.length > 4) xLabels.splice(1, 0, px[Math.floor(px.length / 2)]);

  wrap.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress line chart">
    ${ticks.map((t) => `
      <line x1="${padL}" x2="${W - padR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${padL - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    <line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1"/>
    ${xLabels.map((p) => `<text x="${p.x.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtShort(p.date)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${px.map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    <line id="crossX" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--axis)" stroke-width="1" style="display:none"/>
    <circle id="hoverDot" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
  </svg>
  <div class="tip" id="tip"></div>`;

  const svg = wrap.querySelector('svg');
  const tip = wrap.querySelector('#tip');
  const crossX = wrap.querySelector('#crossX');
  const hoverDot = wrap.querySelector('#hoverDot');

  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const sx = ((clientX - r.left) / r.width) * W;
    let nearest = px[0];
    for (const p of px) if (Math.abs(p.x - sx) < Math.abs(nearest.x - sx)) nearest = p;
    crossX.setAttribute('x1', nearest.x); crossX.setAttribute('x2', nearest.x);
    crossX.style.display = 'block';
    hoverDot.setAttribute('cx', nearest.x); hoverDot.setAttribute('cy', nearest.y);
    hoverDot.style.display = 'block';
    tip.innerHTML = `${nearest.v} ${mUnit} <span class="d">&middot; ${fmtShort(nearest.date)}</span>`;
    tip.style.display = 'block';
    const left = (nearest.x / W) * r.width;
    const top = (nearest.y / H) * r.height;
    tip.style.left = Math.max(48, Math.min(r.width - 48, left)) + 'px';
    tip.style.top = Math.max(30, top - 10) + 'px';
  };
  const hide = () => { tip.style.display = crossX.style.display = hoverDot.style.display = 'none'; };

  svg.addEventListener('pointermove', (e) => show(e.clientX));
  svg.addEventListener('pointerdown', (e) => show(e.clientX));
  svg.addEventListener('pointerleave', hide);
}

/* ================= events ================= */
$('fab').addEventListener('click', newNote);
main.addEventListener('click', (e) => {
  const open = e.target.closest('[data-open]');
  if (open) { openNote(open.dataset.open); return; }
  const det = e.target.closest('[data-detail]');
  if (det) { view = { screen: 'detail', exercise: det.dataset.detail }; render(); }
});
$('tabLog').addEventListener('click', () => { if (view.screen === 'edit') leaveEditor(); view = { screen: 'log' }; render(); });
$('tabProgress').addEventListener('click', () => { if (view.screen === 'edit') leaveEditor(); view = { screen: 'progress' }; render(); });
$('backBtn').addEventListener('click', () => {
  if (view.screen === 'edit') { leaveEditor(); view = { screen: 'log' }; }
  else view = { screen: 'progress' };
  render();
});
$('unitBtn').addEventListener('click', () => {
  unit = unit === 'lb' ? 'kg' : 'lb';
  localStorage.setItem(UNIT_KEY, unit);
  render();
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
